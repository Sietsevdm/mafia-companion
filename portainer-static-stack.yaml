# Recommended: upload this complete folder to /opt/mafia-companion on your VPS.
# Set PROXY_NETWORK in Portainer to the exact existing Nginx Proxy Manager network name.
services:
  mafia-companion:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - /opt/mafia-companion/web:/usr/share/nginx/html:ro
      - /opt/mafia-companion/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
