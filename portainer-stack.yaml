# Ready-built image, published by GitHub Actions. No VPS files or builds needed.
services:
  mafia-companion:
    image: ${LEDGER_IMAGE:-ghcr.io/sietsevdm/mafia-companion:1.0.2}
    container_name: mafia-companion
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
